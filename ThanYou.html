<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;800&display=swap" rel="stylesheet">

<style>
  :root {
    --sky-top: #bfe3ee;
    --sky-bottom: #eaf6f4;
    --sun: #ffd66b;
    --ground: #1f4e4a;
    --grass: #2e6b63;
    --jacket: #f7b32b;
    --pants: #2b2d5b;
    --skin: #b9794f;
    --hair: #1b1b2f;
    --ink: #1b1b2f;
    --pink: #e8478b;
    --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: var(--font);
    color: var(--ink);
    overflow: hidden;
    background: linear-gradient(var(--sky-top), var(--sky-bottom));
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  /* ---------- Scenery ---------- */
  .sun {
    position: absolute;
    top: 9%;
    right: 12%;
    width: clamp(70px, 10vw, 120px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--sun);
    box-shadow: 0 0 0 18px rgba(255, 214, 107, .28), 0 0 0 40px rgba(255, 214, 107, .14);
  }

  .cloud {
    position: absolute;
    height: 26px;
    background: #fff;
    border-radius: 40px;
    opacity: .9;
  }
  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
    background: #fff;
    border-radius: 50%;
  }
  .cloud::before { width: 44px; height: 44px; left: 14px; top: -22px; }
  .cloud::after  { width: 32px; height: 32px; left: 52px; top: -14px; }
  .c1 { width: 110px; top: 18%; left: 8%; }
  .c2 { width: 90px;  top: 30%; left: 62%; transform: scale(.8); }

  .ground {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 18%;
    background: var(--ground);
  }
  .ground::before {
    content: "";
    position: absolute;
    left: 0; right: 0; top: -22px;
    height: 24px;
    background: var(--grass);
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  }

  /* ---------- Person ---------- */
  .person {
    position: absolute;
    bottom: calc(18% - 14px);
    left: 50%;
    height: clamp(230px, 42vh, 340px);
    aspect-ratio: 120 / 240;
    margin-left: calc(clamp(230px, 42vh, 340px) * -0.25);
    transform: translateX(calc(-50vw - 220px));
  }
  .person.in {
    transform: translateX(0);
    transition: transform 3.6s cubic-bezier(.3, .55, .4, 1);
  }
  .person.reset { transition: none; }

  .person svg { width: 100%; height: 100%; overflow: visible; display: block; }

  .shadow { fill: rgba(0, 0, 0, .22); }

  .body-bob { transform-origin: 60px 240px; }

  /* limb pivots (SVG user-space px) */
  .leg-l  { transform-origin: 50px 132px; }
  .leg-r  { transform-origin: 70px 132px; }
  .arm-l  { transform-origin: 40px 78px; }
  .arm-r  { transform-origin: 80px 78px; }
  .eyes   { transform-origin: 60px 38px; }

  .eyes { animation: blink 4s infinite; }
  @keyframes blink {
    0%, 94%, 100% { transform: scaleY(1); }
    97% { transform: scaleY(.1); }
  }

  /* walking */
  .walking .body-bob { animation: bob .5s ease-in-out infinite; }
  .walking .leg-l { animation: swing .9s ease-in-out infinite; }
  .walking .leg-r { animation: swing .9s ease-in-out infinite reverse; }
  .walking .arm-l { animation: swing .9s ease-in-out infinite reverse; }
  .walking .arm-r { animation: swing .9s ease-in-out infinite; }

  @keyframes swing {
    0%, 100% { transform: rotate(-24deg); }
    50%      { transform: rotate(24deg); }
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }

  .skirt { transform-origin: 60px 100px; }
  .walking .skirt { animation: sway .9s ease-in-out infinite; }
  @keyframes sway {
    0%, 100% { transform: rotate(-2.5deg); }
    50%      { transform: rotate(2.5deg); }
  }

  /* waving after arrival */
  .waving .arm-r { animation: wave .55s ease-in-out infinite alternate; }
  @keyframes wave {
    from { transform: rotate(-135deg); }
    to   { transform: rotate(-175deg); }
  }
  .waving .body-bob { animation: happy 1.2s ease-in-out infinite; }
  @keyframes happy {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-4px); }
  }

  /* ---------- Speech bubble ---------- */
  .bubble {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    width: max-content;
    max-width: min(340px, 88vw);
    padding: 16px 26px 14px;
    background: #fff;
    border-radius: 28px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(27, 27, 47, .16);
    transform: translateX(-50%) scale(0);
    transform-origin: 50% 100%;
    opacity: 0;
    pointer-events: none;
  }
  .bubble::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -14px;
    margin-left: -14px;
    border: 14px solid transparent;
    border-top-color: #fff;
    border-bottom: 0;
  }
  .bubble.show {
    opacity: 1;
    animation: pop .55s cubic-bezier(.2, 1.6, .4, 1) forwards;
  }
  @keyframes pop {
    from { transform: translateX(-50%) scale(0); }
    to   { transform: translateX(-50%) scale(1); }
  }

  .bubble .title {
    display: block;
    font-weight: 800;
    font-size: clamp(2rem, 7vw, 3.2rem);
    line-height: 1.05;
    color: var(--pink);
    min-height: 1.05em;
  }
  .bubble .sub {
    display: block;
    margin-top: 6px;
    font-weight: 500;
    font-size: clamp(1rem, 3vw, 1.2rem);
    line-height: 1.3;
    min-height: 1.3em;
  }
  .caret::after {
    content: "";
    display: inline-block;
    width: 3px;
    height: .85em;
    margin-left: 3px;
    vertical-align: -.05em;
    background: currentColor;
    animation: caret .7s steps(1) infinite;
  }
  @keyframes caret { 50% { opacity: 0; } }

  /* ---------- Confetti ---------- */
  .confetti-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .piece {
    position: absolute;
    top: -20px;
    width: 10px;
    height: 16px;
    border-radius: 2px;
    opacity: 0;
    animation: fall linear forwards;
  }
  @keyframes fall {
    0%   { opacity: 1; transform: translate3d(0, 0, 0) rotate(0deg); }
    100% { opacity: 1; transform: translate3d(var(--drift), 110vh, 0) rotate(var(--spin)); }
  }

  /* ---------- Replay ---------- */
  .replay {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 10px 20px;
    font: 800 1rem var(--font);
    color: #fff;
    background: var(--ink);
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    opacity: 0;
    transform: translateY(-8px);
    transition: opacity .4s, transform .4s, background .2s;
    pointer-events: none;
  }
  .replay.visible { opacity: 1; transform: none; pointer-events: auto; }
  .replay:hover { background: var(--pink); }
  .replay:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .person.in { transition-duration: .01s; }
    .walking .body-bob, .walking .leg-l, .walking .leg-r, .walking .arm-l, .walking .arm-r,
    .waving .arm-r, .waving .body-bob, .walking .skirt, .eyes { animation: none; }
    .waving .arm-r { transform: rotate(-150deg); }
    .bubble.show { animation-duration: .01s; }
  }
</style>
</head>

<body>
  <main class="stage" id="stage">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="ground"></div>

    <div class="confetti-layer" id="confetti" aria-hidden="true"></div>

    <div class="person" id="person">
      <div class="bubble" id="bubble" role="status" aria-live="polite">
        <span class="title" id="title"></span>
        <span class="sub" id="sub"></span>
      </div>

      <svg viewBox="0 0 120 240" role="img" aria-label="A woman walking in and waving">
        <ellipse class="shadow" cx="60" cy="236" rx="38" ry="6"/>

        <g class="body-bob">
          <!-- long hair (behind) -->
          <path d="M31 38 C27 6 93 6 89 38 L95 120 Q92 134 78 128 L78 62 L42 62 L42 128 Q28 134 25 120 Z" fill="#1b1b2f"/>

          <!-- legs -->
          <g class="leg-l">
            <rect x="45" y="128" width="11" height="84" rx="5.5" fill="#b9794f"/>
            <ellipse cx="49" cy="218" rx="13" ry="7" fill="#e8478b"/>
          </g>
          <g class="leg-r">
            <rect x="64" y="128" width="11" height="84" rx="5.5" fill="#b9794f"/>
            <ellipse cx="71" cy="218" rx="13" ry="7" fill="#e8478b"/>
          </g>

          <!-- left arm (behind dress) -->
          <g class="arm-l">
            <rect x="31" y="74" width="11" height="58" rx="5.5" fill="#b9794f"/>
            <rect x="29.5" y="72" width="14" height="20" rx="7" fill="#7a5cff"/>
            <circle cx="36.5" cy="135" r="6.5" fill="#b9794f"/>
          </g>

          <!-- dress -->
          <path class="skirt" d="M40 68 Q60 62 80 68 L84 100 L99 158 Q60 170 21 158 L36 100 Z" fill="#7a5cff"/>
          <path d="M36 104 Q60 114 84 104" fill="none" stroke="#5a3fd6" stroke-width="4" stroke-linecap="round"/>
          <path d="M22 156 Q60 168 98 156" fill="none" stroke="#e8478b" stroke-width="4" stroke-linecap="round"/>

          <!-- neck + head -->
          <rect x="54" y="58" width="12" height="14" rx="5" fill="#b9794f"/>
          <circle cx="60" cy="40" r="25" fill="#b9794f"/>
          <!-- hair fringe -->
          <path d="M34 40 C31 12 58 6 76 14 C88 20 90 32 86 42 C80 30 68 22 56 24 C46 26 38 32 34 40 Z" fill="#1b1b2f"/>
          <!-- earrings -->
          <circle cx="35" cy="52" r="3" fill="#ffd66b"/>
          <circle cx="85" cy="52" r="3" fill="#ffd66b"/>
          <!-- eyes with lashes -->
          <g class="eyes">
            <ellipse cx="50" cy="40" rx="3.2" ry="4.2" fill="#1b1b2f"/>
            <ellipse cx="70" cy="40" rx="3.2" ry="4.2" fill="#1b1b2f"/>
            <path d="M44.5 36 L47 38 M47 33.5 L48.5 36.5 M75.5 36 L73 38 M73 33.5 L71.5 36.5" stroke="#1b1b2f" stroke-width="1.8" stroke-linecap="round"/>
          </g>
          <circle cx="42" cy="50" r="4.5" fill="#e8478b" opacity=".35"/>
          <circle cx="78" cy="50" r="4.5" fill="#e8478b" opacity=".35"/>
          <path d="M49 51 Q60 61 71 51" fill="none" stroke="#c4235f" stroke-width="3.2" stroke-linecap="round"/>

          <!-- right arm (waves) -->
          <g class="arm-r">
            <rect x="78" y="74" width="11" height="58" rx="5.5" fill="#b9794f"/>
            <rect x="76.5" y="72" width="14" height="20" rx="7" fill="#7a5cff"/>
            <circle cx="83.5" cy="135" r="6.5" fill="#b9794f"/>
          </g>
        </g>
      </svg>
    </div>

    <button class="replay" id="replay" type="button">Replay</button>
  </main>

<script>
  /* ---- Change your message here ---- */
  const MESSAGE = "Thank you!";
  // const SUBTEXT = "I really appreciate your time.";
  /* ---------------------------------- */

  const person  = document.getElementById("person");
  const bubble  = document.getElementById("bubble");
  const titleEl = document.getElementById("title");
  const subEl   = document.getElementById("sub");
  const confetti = document.getElementById("confetti");
  const replayBtn = document.getElementById("replay");

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const WALK_MS = reduceMotion ? 10 : 3600;
  const timers = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));

  function type(el, text, speed, done) {
    let i = 0;
    el.classList.add("caret");
    (function step() {
      el.firstChild ? (el.firstChild.nodeValue = text.slice(0, i)) : el.append(text.slice(0, i));
      if (i++ < text.length) {
        later(step, speed);
      } else {
        el.classList.remove("caret");
        done && done();
      }
    })();
  }

  function burst() {
    const colors = ["#e8478b", "#f7b32b", "#2b2d5b", "#2e9c8f", "#ffffff", "#7a5cff"];
    for (let i = 0; i < 90; i++) {
      const p = document.createElement("span");
      p.className = "piece";
      p.style.left = Math.random() * 100 + "%";
      p.style.background = colors[i % colors.length];
      p.style.width = 6 + Math.random() * 8 + "px";
      p.style.height = 10 + Math.random() * 10 + "px";
      p.style.setProperty("--drift", (Math.random() * 200 - 100) + "px");
      p.style.setProperty("--spin", (360 + Math.random() * 720) + "deg");
      p.style.animationDuration = 2.4 + Math.random() * 2.2 + "s";
      p.style.animationDelay = Math.random() * 0.8 + "s";
      confetti.appendChild(p);
      setTimeout(() => p.remove(), 6000);
    }
  }

  function reset() {
    timers.forEach(clearTimeout);
    timers.length = 0;
    person.classList.add("reset");
    person.classList.remove("in", "walking", "waving");
    bubble.classList.remove("show");
    titleEl.textContent = "";
    subEl.textContent = "";
    replayBtn.classList.remove("visible");
    confetti.innerHTML = "";
    void person.offsetWidth;           // force reflow so the reset applies instantly
    person.classList.remove("reset");
  }

  function play() {
    reset();
    person.classList.add("walking");
    requestAnimationFrame(() => requestAnimationFrame(() => person.classList.add("in")));

    later(() => {
      person.classList.remove("walking");
      person.classList.add("waving");
      bubble.classList.add("show");

      later(() => {
        type(titleEl, MESSAGE, 70, () => {
          burst();
          type(subEl, SUBTEXT, 35, () => replayBtn.classList.add("visible"));
        });
      }, 450);
    }, WALK_MS);
  }

  replayBtn.addEventListener("click", play);
  window.addEventListener("load", play);
</script>
</body>
</html>
